name: Build CV PDF

# Rebuild cv.pdf whenever the CV source changes, then commit it back.
on:
  push:
    branches: [main]
    paths:
      - "cv.Rmd"
      - "preamble.tex"
      - "cv/**"
      - "fonts/**"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages
        run: |
          tlmgr update --self
          tlmgr install fontspec xcolor enumitem geometry fancyhdr lastpage \
            hyperref parskip needspace tools

      - name: Install R packages
        run: Rscript -e 'install.packages("rmarkdown")'

      - name: Render cv.pdf
        run: Rscript -e 'rmarkdown::render("cv.Rmd")'

      - name: Commit updated cv.pdf
        run: |
          if git diff --quiet -- cv.pdf; then
            echo "cv.pdf unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -m "Rebuild cv.pdf"
          git push
